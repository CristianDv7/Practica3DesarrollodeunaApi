<section class="form-panel">
  <div class="section-heading">
    <span class="index">01</span>
    <div>
      <p class="kicker">CAPTURA</p>
      <h2>{{ employee ? 'Editar empleado' : 'Nuevo empleado' }}</h2>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>Nombre <input formControlName="nombre" placeholder="Ej. Ana Torres"></label>
    @if (form.controls.nombre.touched && form.controls.nombre.invalid) { <small>Ingresa al menos 3 caracteres.</small> }
    <label>Cargo <input formControlName="cargo" placeholder="Ej. Analista"></label>
    <label>Departamento <input formControlName="departamento" placeholder="Ej. Tecnología"></label>
    <label>Sueldo <input formControlName="sueldo" type="number" min="0" placeholder="0"></label>
    <div class="actions">
      <button class="primary" type="submit">{{ employee ? 'Actualizar' : 'Guardar' }}</button>
      @if (employee) { <button class="secondary" type="button" (click)="cancel.emit()">Cancelar</button> }
    </div>
  </form>
</section>
